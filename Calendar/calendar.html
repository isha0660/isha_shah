    <main class="container py-5">

        <h1 class="mb-4">
            Calendar
        </h1>

        <div class="row">
            <div class="col-2">
                <div class="custom-container">
                    <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#event_modal">Create Event</button>
                </div>
            </div>

            <div class="col">
                <div class="container-md container-fluid py-4 h-100">
                    <div id="calendar" class="row h-100">
                        <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="sunday">
                            <div class="h6 text-center position-relative py-2 day">
                                Sunday
                            </div>
                        </div>

                        <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="monday">
                            <div class="h6 text-center position-relative py-2 day">
                                Monday
                            </div>
                        </div>

                        <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="tuesday">
                            <div class="h6 text-center position-relative py-2 day">
                                Tuesday
                            </div>
                        </div>

                        <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="wednesday">
                            <div class="h6 text-center position-relative py-2 day">
                                Wednesday
                            </div>
                        </div>

                        <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="thursday">
                            <div class="h6 text-center position-relative py-2 day">
                                Thursday
                            </div>
                        </div>

                        <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="friday">
                            <div class="h6 text-center position-relative py-2 day">
                                Friday
                            </div>
                        </div>

                        <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="saturday">
                            <div class="h6 text-center position-relative py-2 day">
                                Saturday
                            </div>
                        </div>

                    </div> 

                </div>
            </div>
        </div>

        <div class="modal fade" id="event_modal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="eventModalLabel">Create Event</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="event_form">

                        <!-- Event Name -->
                        <div class="mb-3">
                            <label for="event_name" class="form-label">Event Name</label>
                            <input type="text" class="form-control" id="event_name" required>
                            <div class="invalid-feedback">
                                Please enter an event name.
                            </div>
                        </div>

                        <!-- Days -->
                        <div class="mb-3">
                            <label for="event_weekday" class="form-label">Day</label>
                            <select class="form-select" id="event_weekday" required>
                            <option value="Sunday">Sunday</option>
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                            </select>
                        </div>

                        <!-- Time -->
                        <div class="mb-3">
                            <label for="event_time" class="form-label">Time</label>
                            <input type="time" class="form-control" id="event_time" required>
                            <div class="invalid-feedback">
                                Please enter a time.
                            </div>
                        </div>

                        <!-- Event Modality -->
                        <div class="mb-3">
                            <label for="event_modality" class="form-label">Event Modality</label>
                            <select class="form-select" id="event_modality" required onchange="updateLocationOptions()">
                            <option value="in-person">In-person</option>
                            <option value="remote">Remote</option>
                            </select>
                        </div>

                        <!-- Event Location -->
                        <div class="mb-3" id="location_container">
                            <label for="event_location" class="form-label">Location</label>
                            <input type="text" class="form-control" placeholder="Enter physical address" id="event_location">
                            <div class="invalid-feedback">
                                Please enter a location.
                            </div>
                        </div>

                        <!-- Event URL -->
                        <div class="mb-3" id="remote_url_container">
                            <label for="event_remote_url" class="form-label">Remote URL</label>
                            <input
                                type="url"
                                class="form-control"
                                id="event_remote_url"
                                pattern="https?://.+"
                                placeholder="https://example.com/meeting">
                            <div class="invalid-feedback">
                            Please enter a meeting url.
                            </div>
                        </div>

                        <!-- Event Category -->
                        <div class="mb-3">
                            <label for="event_category" class="form-label">Event Category</label>
                            <select class="form-select" id="event_category" required>
                            <option value="Academic">Academic</option>
                            <option value="Work">Work</option>
                            <option value="Personal">Personal</option>
                            <option value="Social">Social</option>
                            </select>
                        </div>

                        <!-- Event Attendees -->
                        <div class="mb-3">
                            <label for="event_attendees" class="form-label">Attendees</label>
                            <input
                                type="text"
                                class="form-control"
                                id="event_attendees"
                                pattern="[^,]+(,\s*[^,]+)*"
                                placeholder="Enter names separated by commas" required>
                            <div class="invalid-feedback">
                                Please enter attendees.
                            </div>
                        </div>

                    </form>
                </div>

                <div class="modal-footer">
                    <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Close
                    </button>

                    <button
                    type="button"
                    class="btn btn-primary"
                    onclick="saveEvent()">
                    Save Event
                    </button>
                </div>

                </div>
            </div>
        </div>
    </main>
